<script type="module">
const mountScene = (() => {
// All particle poses share one vertex buffer, so a gesture only changes three
// interpolation weights. The hand tracker and the scene have independent clocks.
const TAU = Math.PI * 2;
const SKY_SPEED = TAU / 72;
const COMET_PERIOD = 9;
const COMET_TURNS = 2.15;
const COMET_TAIL = .30; // Fraction of the trip up the tree retained in the trail.
const COMET_SAMPLES = 256;
const COMET_COLORS = [[1,.65,.23],[.43,.94,.81],[1,.43,.52]];
const PHOTO_SPEED = TAU / 24;
const GALAXY_SPEED = TAU / 54;
const MODES = {tree: 0, photo: 1, galaxy: 2};
const STRIDE = 13;
const PALETTE = [
    [1, .87, .60], [.98, .72, .34], [1, .95, .82], [.88, .49, .20],
    [1, .43, .32], [.40, .85, .59], [.97, .79, .49]
];
const GALAXY_COLORS=[[1,.88,.67],[.78,.87,1],[.47,.69,1],[.94,.76,.83]];
const TREE_SKY='radial-gradient(ellipse 54% 68% at 50% 62%, rgba(128,64,30,.90) 0%, rgba(86,43,29,.76) 41%, rgba(34,17,21,.43) 75%, transparent 100%), linear-gradient(180deg,#0c0911,#211116 59%,#100a0d)';

function layout(width, height) {
    // Scale the drawing with the available stage, including when a phone turns sideways.
    const treeHeight = Math.min(height * .63, width * 1.02);
    const tilt = width < height*.9 ? -1.16 : -.27;
    const c = Math.cos(tilt), s = Math.sin(tilt), flatten = .61;
    const radiusX = Math.min(width*.446 / Math.hypot(c,flatten*s), height*.365 / Math.hypot(s,flatten*c));
    return {
        disk:{tilt, radiusX, radiusY:radiusX*flatten, angle:0},
        treeWidth: treeHeight * .423, treeHeight, treeBase: height * .55 + treeHeight * .54,
        sphereRadius: Math.min(width*.425,height*.365),
        centerY: height * .509,
        // Even landscape photos leave visible arcs down both sides of the frame.
        photoWidth: Math.min(width * .57, Math.max(width * .455, height * .73)),
        photoHeight: Math.min(height * .47, Math.max(height * .40, width * .55)),
        dotScale: Math.max(.72, Math.min(1.7, Math.min(height / 585, width / 620)))
    };
}

function makeField(count) {
    let state = 0x12c27;
    const random = () => {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        return state / 4294967296;
    };
    const jitter = () => random() + random() + random() - 1.5;
    const data = [];
    for (let i = 0; i < count; i++) {
        const t = random() ** .64; // circumference grows towards the lower branches
        // Approximately half the lights trace loose, overlapping spiral garlands.
        const theta = random() < .48 ? t * TAU * 4.4 + jitter() * .65 + (i % 3) * TAU / 3 : random() * TAU;
        const radius = (.70 + random() * .31) * t;
        const tree = [radius * Math.cos(theta), 1 - t, radius * Math.sin(theta)];
        const angle = random() * TAU;
        const ring = random() < .8 ? .86 + jitter() * .27 : Math.sqrt(random()) * 1.16;
        const photo = [Math.cos(angle) * ring, Math.sin(angle) * ring, random()];
        // Uniform area sampling leaves the two poles as populated as the equator.
        const latitude=random()*2-1, longitude=TAU*random();
        const shellRadius=random()<.88 ? .972+.028*random() : .89*Math.cbrt(random());
        const latitudeRing=shellRadius*Math.sqrt(1-latitude*latitude);
        const galaxy=[latitudeRing*Math.cos(longitude),latitude*shellRadius,latitudeRing*Math.sin(longitude)];
        const n = random(), k = random();
        const kind = n < .077 ? 1 : n < .148 ? 2 : n < .193 ? 3 : 0;
        const diameter = kind === 1 ? 3.7 + 8.5 * random() ** 2 :
            kind >= 2 ? 4.2 + 10.2 * random() ** 2 : 1.6 + 4.3 * random() ** 2;
        const color = kind === 1 ? (k < .17 ? 4 : k < .29 ? 5 : k < .64 ? 1 : 0) :
            kind >= 2 ? (k < .67 ? 2 : 0) :
            k < .26 ? 0 : k < .59 ? 1 : k < .72 ? 2 : k < .85 ? 3 :
            k < .88 ? 4 : k < .90 ? 5 : 6;
        data.push(...tree, ...photo, ...galaxy, diameter, kind, color, random());
    }
    // A disk extending past all four corners stays populated at every angle.
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));
    for (const [kind, amount] of [[4, 72], [6, 228]]) {
        for (let i = 0; i < amount; i++) {
            const radius = Math.sqrt((i + random()) / amount);
            const angle = i * goldenAngle + kind + (random() - .5) * .15;
            const bokeh = kind === 4;
            data.push(radius*Math.cos(angle), radius*Math.sin(angle), 0, 0, 0, 0, 0, 0, 0,
                bokeh ? 12 + random() ** 2 * 55 : 1.35 + random() ** 3 * 5.5,
                kind, bokeh ? 3 : 2, random());
        }
    }
    // The topper and wrapped presents own galaxy positions just like the lights.
    data.push(0, 1.052, 0, 0, 0, 0, -.49,-.65,.58, 43, 5, 2, .1);
    // Lay down the dim tail first and the hot leading point last.
    for (let strand=0; strand<3; strand++) {
        for (let sample=COMET_SAMPLES-1; sample>=0; sample--) {
            const age=sample/(COMET_SAMPLES-1);
            data.push(strand,age,0, 0,0,0, 0,0,0, 0,8,strand,0);
        }
    }
    const giftRows = [[.26,1],[.41,2],[.56,2],[.69,3],[.83,3],[.95,4]];
    let giftIndex=0;
    for(const [depth, amount] of giftRows) {
        for(let i=0;i<amount;i++) {
            const angle = depth*10 + i*TAU/amount;
            const radius = depth*.89;
            const height = 1-depth + .025*Math.sin(i*2.4+angle);
            const wrap = (i+Math.round(10*depth)) % 3;
            const latitude=1-2*(giftIndex+.5)/15, orbit=goldenAngle*giftIndex++;
            const spread=Math.sqrt(1-latitude*latitude);
            data.push(Math.cos(angle)*radius,height,Math.sin(angle)*radius, 0,0,0,
                spread*Math.cos(orbit),latitude,spread*Math.sin(orbit),
                26+10*depth,7,wrap,random());
        }
    }
    return new Float32Array(data);
}

const VERTEX = `
attribute vec3 aTree;
attribute vec3 aPhoto;
attribute vec3 aGalaxy;
attribute vec4 aSprite;
uniform vec2 uViewport;
uniform vec2 uSkyRotation;
uniform vec4 uOrbit;
uniform vec2 uPitch;
uniform vec3 uHand;
uniform vec2 uScatter;
uniform vec3 uTree;
uniform vec4 uOther;
uniform vec3 uWeight;
uniform vec4 uFrame;
uniform float uCenterY;
varying lowp vec3 vColor;
varying mediump float vKind;
varying mediump float vAlpha;
varying mediump float vPhase;
vec3 palette(float i) {
    if(i < .5) return vec3(1.,.87,.60);
    if(i < 1.5) return vec3(.98,.72,.34);
    if(i < 2.5) return vec3(1.,.95,.82);
    if(i < 3.5) return vec3(.88,.49,.20);
    if(i < 4.5) return vec3(1.,.43,.32);
    if(i < 5.5) return vec3(.40,.85,.59);
    return vec3(.97,.79,.49);
}
void main() {
    float time = uFrame.x, phase = aSprite.w * 6.283185;
    if(aSprite.y==8.) {
        float strand=aTree.x, age=aTree.y;
        float h=fract(time/${COMET_PERIOD.toFixed(1)}+.21+strand/3.-age*${COMET_TAIL});
        float angle=6.283185*(h*${COMET_TURNS}+strand/3.)+.115*time-uHand.x;
        float radius=.045+1.075*(1.-h), depth=sin(angle)*radius;
        vec2 p=vec2(uViewport.x*.5+cos(angle)*radius*uTree.x,
                    uTree.z-.5*uTree.y+(.5-h)*uTree.y*uHand.z+depth*(uTree.y*.065+uTree.x*uHand.y));
        float head=exp(-age*60.), fade=(1.-age)*(1.-age);
        vKind=8.;
        vColor=strand<.5 ? vec3(${COMET_COLORS[0].map(n=>n.toFixed(2)).join(',')}) :
               strand<1.5 ? vec3(${COMET_COLORS[1].map(n=>n.toFixed(2)).join(',')}) : vec3(${COMET_COLORS[2].map(n=>n.toFixed(2)).join(',')});
        vPhase=head;
        vAlpha=uWeight.x*(.34+.66*(.5+.5*sin(angle)))*(.46+.54*smoothstep(0.,.025,min(h,1.-h)))*fade;
        gl_Position=vec4(p/uViewport*vec2(2.,-2.)+vec2(-1.,1.),0.,1.);
        gl_PointSize=clamp((4.+8.*(1.-age)+13.*head)*uFrame.z*uFrame.y,1.,uFrame.w);
        return;
    }
    float spin = time * .115-uHand.x;
    float z = aTree.x * sin(spin) + aTree.z * cos(spin);
    float x = aTree.x * cos(spin) - aTree.z * sin(spin);
    vec2 tree = vec2(uViewport.x*.5+x*uTree.x,
        uTree.z-.5*uTree.y+(.5-aTree.y)*uTree.y*uHand.z+z*(uTree.y*.024+uTree.x*uHand.y));
    // Four overlapping departure waves. Reversing the gesture runs every item
    // back along its own arc, including when the reversal happens mid-flight.
    float delay=floor(aSprite.w*4.)*.065;
    float spread=smoothstep(delay,.805+delay,uWeight.z);
    float photoShare=clamp(uWeight.y/max(.00001,1.-uWeight.z),0.,1.);
    bool ornament=aSprite.y==5. || aSprite.y==7.;
    vec2 origin=tree;
    if(uWeight.y>0.) {
        vec2 orbit=vec2(aPhoto.x*uOrbit.x-aPhoto.y*uOrbit.y,aPhoto.x*uOrbit.y+aPhoto.y*uOrbit.x);
        orbit.y=orbit.y*uHand.z + .25*sin(phase)*uHand.y;
        if(!ornament) origin=mix(tree,vec2(uViewport.x*.5,uCenterY)+orbit*uOther.xy,photoShare);
    }
    vec2 p=origin;
    vKind = aSprite.y;
    vColor = palette(aSprite.z);
    vPhase = phase;
    float brightness = 1.0 + .19*sin(time*(1.+aSprite.w*1.4)+phase*7.);
    float depth = 1. + z*.22*uWeight.x;
    vAlpha = (.73 + .42*aSprite.w) * brightness * depth;
    float size = aSprite.x * uFrame.z * depth;
    float ornamentLight=1., ornamentSize=1.;
    if(spread>0. && (aSprite.y<4. || ornament)) {
        vec3 shuffled=aGalaxy+vec3(.13*sin(phase)*uScatter.x,.13*cos(phase)*uScatter.y,.14*(aSprite.w-.5)*uScatter.x);
        shuffled*=length(aGalaxy)/max(.00001,length(shuffled));
        shuffled.xz=vec2(shuffled.x*uScatter.y+shuffled.z*uScatter.x,shuffled.z*uScatter.y-shuffled.x*uScatter.x);
        float gx=shuffled.x*uOrbit.z+shuffled.z*uOrbit.w, gz=shuffled.z*uOrbit.z-shuffled.x*uOrbit.w;
        float gy=shuffled.y*uPitch.x+gz*uPitch.y, distance=gz*uPitch.x-shuffled.y*uPitch.y;
        vec2 offset=vec2(gx,gy)*uOther.z/(1.-.18*distance);
        vec2 delta=vec2(uViewport.x*.5,uCenterY)+offset-origin;
        float bend=4.*spread*(1.-spread)*(.12+.15*aSprite.w);
        p=origin+delta*spread+vec2(-delta.y,delta.x)*uViewport/uViewport.yx*bend;
        float proximity=clamp(.94+.48*distance,.38,1.5);
        float light=clamp(.56+.60*distance-.16*gx-.18*gy,.14,1.32)
              +.28*pow(max(0.,1.-abs(distance)),4.);
        ornamentLight=mix(1.,.67+.32*distance,spread);
        ornamentSize=mix(1.,.90+.21*distance,spread);
        float core=dot(aGalaxy.xy,aGalaxy.xy);
        vec3 starlight=core<.075 || aSprite.w<.23 ? vec3(1.,.88,.67)
            : aSprite.w<.71 ? vec3(.78,.87,1.) : aSprite.w<.89 ? vec3(.47,.69,1.) : vec3(.94,.76,.83);
        if(aSprite.y==0.) vColor=mix(vColor,starlight,.65*spread);
        vAlpha*=mix(1.,light,spread);
        size*=mix(1.,proximity,spread);
    }
    if(vKind == 4. || vKind == 6.) {
        // Pixel y increases down the screen, so positive rotation is clockwise.
        p = uViewport*.5 + vec2(
            aTree.x*uSkyRotation.x-aTree.y*uSkyRotation.y,
            aTree.x*uSkyRotation.y+aTree.y*uSkyRotation.x);
        size = aSprite.x * uFrame.z;
        vAlpha = vKind==4. ? .12+.12*aSprite.w : .36+.40*brightness;
    }
    if(vKind == 5.) {
        vAlpha = (spread+(1.-spread)*(1.-photoShare))*ornamentLight;
        size=aSprite.x*uFrame.z*mix(1.,.53,spread)*ornamentSize;
    }
    if(vKind == 7.) {
        vPhase = aSprite.z;
        vAlpha = (spread+(1.-spread)*(1.-photoShare))*(.88+.12*z)*ornamentLight;
        size = max(23.,aSprite.x*uFrame.z)*(1.+.12*z)*mix(1.,.62,spread)*ornamentSize;
    }
    gl_Position = vec4(p/uViewport*vec2(2.,-2.)+vec2(-1.,1.),0.,1.);
    gl_PointSize = clamp(size*uFrame.y, 1., uFrame.w);
}`;

const FRAGMENT = `
precision mediump float;
varying lowp vec3 vColor;
varying mediump float vKind;
varying mediump float vAlpha;
varying mediump float vPhase;
uniform sampler2D uGifts;
float star(vec2 p, float rotation){
    float a = abs(mod(atan(p.x,-p.y)+rotation+.62832,1.25664)-.62832);
    float edge = .2351 / (.4*sin(.62832-a) + sin(a));
    return 1.-smoothstep(edge-.045,edge+.025,length(p));
}
void main() {
    vec2 p = gl_PointCoord*2.-1.;
    float r = length(p);
    float light;
    vec3 color = vColor;
    if(vKind==8.) {
        float core=exp(-r*r*28.), halo=exp(-r*r*5.);
        color=mix(color,vec3(1.,.99,.92),core*(.38+.58*vPhase));
        light=.34*halo+core;
    } else if(vKind==7.) {
        // Each atlas cell has a transparent margin for bilinear filtering.
        vec4 gift=texture2D(uGifts,vec2((gl_PointCoord.x+vPhase)/3.,gl_PointCoord.y));
        gl_FragColor=vec4(gift.rgb,gift.a*vAlpha);
        return;
    } else if (vKind < .5) {
        light = (1.-smoothstep(.10,.91,r))*.86;
    } else if(vKind < 1.5) {
        // A small faceted ornament with an edge light and a hot glint.
        float facet = .88+.10*cos(6.*atan(p.y,p.x)+vPhase);
        light = (1.-smoothstep(facet-.10,facet,r))*.94;
        float highlight = exp(-16.*dot(p+vec2(.30,.33),p+vec2(.30,.33)));
        color = mix(color*.96,vec3(1.,.97,.84),highlight*.85);
    } else if (vKind < 2.5 || vKind > 5.5) {
        float spike = pow(max(0.,1.-abs(p.x*p.y)*18.-r*.88),3.);
        light = spike + .42*exp(-r*r*11.);
    } else if(vKind < 3.5 || vKind == 5.) {
        float rotation = vKind == 5. ? -.21 : vPhase;
        light = star(p*1.24,rotation) + .40*exp(-r*r*4.)*(1.-smoothstep(.72,1.,r));
    } else {
        light = exp(-r*r*5.)*(1.-smoothstep(.7,1.,r));
    }
    gl_FragColor = vec4(color, clamp(light*vAlpha,0.,1.));
}`;

function compile(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message);
    }
    return shader;
}

const GIFT_CELL=96;
function makeGiftAtlas() {
    const atlas=document.createElement('canvas');
    atlas.width=3*GIFT_CELL; atlas.height=GIFT_CELL;
    const ctx=atlas.getContext('2d');
    const papers=[
        ['#e7584e','#8e2331','#5b1c2c','#d64744'],
        ['#3c9980','#195c51','#123c37','#418e77'],
        ['#efbb67','#bd7939','#7a472a','#d8a05c']
    ];
    function face(vertices,fill) {
        ctx.beginPath(); ctx.moveTo(...vertices[0]);
        for(let i=1;i<vertices.length;i++) ctx.lineTo(...vertices[i]);
        ctx.closePath(); ctx.fillStyle=fill; ctx.fill();
    }
    papers.forEach(([bright,front,side,lid],index)=>{
        ctx.save();
        ctx.translate(index*GIFT_CELL,0); ctx.scale(GIFT_CELL/64,GIFT_CELL/64);
        const paper=ctx.createLinearGradient(9,20,32,56);
        paper.addColorStop(0,bright); paper.addColorStop(1,front);
        const silk=ctx.createLinearGradient(15,20,42,51);
        if(index===2) {
            silk.addColorStop(0,'#f9a89a'); silk.addColorStop(.45,'#c95859');
            silk.addColorStop(1,'#9b303d');
        } else {
            silk.addColorStop(0,'#fff1bd'); silk.addColorStop(.48,'#eeb764');
            silk.addColorStop(1,'#c18a3d');
        }
        // Two faces, overhanging lid and ribbon that wraps over the top.
        face([[9,26],[36,35],[36,58],[9,49]],paper);
        face([[36,35],[56,25],[55,49],[36,58]],side);
        face([[20,30],[26,32],[26,55],[20,53]],silk);
        face([[43,32],[48,29],[47,53],[43,55]],silk);
        face([[6,23],[28,14],[59,21],[36,33]],bright);
        face([[6,23],[36,33],[36,38],[6,28]],lid);
        face([[36,33],[59,21],[59,26],[36,38]],front);
        face([[17,27],[39,17],[46,18],[24,29]],silk);
        face([[17,27],[24,29],[24,34],[17,32]],silk);
        face([[16,19],[21,17],[52,24],[46,27]],silk);
        face([[46,27],[52,24],[52,29],[46,32]],silk);
        // The two open silk loops stay legible at a phone's small sprite size.
        ctx.lineJoin='round'; ctx.lineCap='round';
        ctx.strokeStyle=index===2?'#b9404b':'#ffd58b'; ctx.lineWidth=3.2;
        ctx.beginPath(); ctx.moveTo(31,20);
        ctx.bezierCurveTo(13,18,15,4,22,7); ctx.bezierCurveTo(28,9,29,16,31,20);
        ctx.bezierCurveTo(37,5,49,5,46,11); ctx.bezierCurveTo(44,16,37,19,31,20);
        ctx.stroke();
        ctx.strokeStyle=index===2?'#ffc2af':'#fff0bd'; ctx.lineWidth=1.05;
        ctx.beginPath(); ctx.moveTo(19,8); ctx.bezierCurveTo(24,5,29,16,31,19);
        ctx.moveTo(33,17); ctx.quadraticCurveTo(40,6,45,8); ctx.stroke();
        ctx.fillStyle=index===2?'#ea8d8a':'#ffe2a5';
        ctx.beginPath(); ctx.ellipse(31.6,19.5,3.7,2.6,-.24,0,TAU); ctx.fill();
        ctx.restore();
    });
    return atlas;
}

function gpuRenderer(gl, field) {
    const program = gl.createProgram();
    const shaders = [compile(gl, gl.VERTEX_SHADER, VERTEX), compile(gl, gl.FRAGMENT_SHADER, FRAGMENT)];
    for (const shader of shaders) gl.attachShader(program, shader);
    gl.linkProgram(program);
    for (const shader of shaders) gl.deleteShader(shader);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, field, gl.STATIC_DRAW);
    for (const [name, size, offset] of [['aTree',3,0],['aPhoto',3,3],['aGalaxy',3,6],['aSprite',4,9]]) {
        const location = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, size, gl.FLOAT, false, STRIDE*4, offset*4);
    }
    const uniform = Object.fromEntries(['Viewport','SkyRotation','Orbit','Pitch','Hand','Scatter','Tree','Other','Weight','Frame','CenterY','Gifts']
        .map(key => [key, gl.getUniformLocation(program, 'u'+key)]));
    const gifts=gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D,gifts);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,makeGiftAtlas());
    gl.uniform1i(uniform.Gifts,0);
    const total=field.length/STRIDE;
    let giftStart=total;
    while(giftStart>0 && field[(giftStart-1)*STRIDE+10]===7) giftStart--;
    const maxSize = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
    gl.enable(gl.BLEND);
    gl.clearColor(0,0,0,0);
    return {
        draw(w, h, ratio, l, weights, time, skyCos, skySin, shuffle=0, handYaw=0, handPitch=0) {
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform2f(uniform.Viewport, w, h);
            gl.uniform2f(uniform.SkyRotation, skyCos, skySin);
            const photoAngle=time*PHOTO_SPEED+.6*handYaw, yaw=time*GALAXY_SPEED+handYaw;
            const pitch=-.14+handPitch, treePitch=handPitch*.32;
            gl.uniform4f(uniform.Orbit,Math.cos(photoAngle),Math.sin(photoAngle),Math.cos(yaw),Math.sin(yaw));
            gl.uniform2f(uniform.Pitch,Math.cos(pitch),Math.sin(pitch));
            gl.uniform3f(uniform.Hand,handYaw,Math.sin(treePitch),Math.cos(treePitch));
            gl.uniform2f(uniform.Scatter,Math.sin(shuffle),Math.cos(shuffle));
            gl.uniform3f(uniform.Tree, l.treeWidth, l.treeHeight, l.treeBase);
            gl.uniform4f(uniform.Other, l.photoWidth, l.photoHeight, l.sphereRadius, l.sphereRadius);
            gl.uniform1f(uniform.CenterY, l.centerY);
            gl.uniform3fv(uniform.Weight, weights);
            gl.uniform4f(uniform.Frame, time, ratio, l.dotScale, maxSize);
            gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
            gl.drawArrays(gl.POINTS,0,giftStart);
            if(weights[1]<1 && giftStart<total) {
                // Opaque wrapping paper sits in front of the background fairy lights.
                gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
                gl.drawArrays(gl.POINTS,giftStart,total-giftStart);
            }
        },
        dispose() { gl.deleteTexture(gifts); gl.deleteBuffer(buffer); gl.deleteProgram(program); }
    };
}

function canvasRenderer(canvas, field) {
    const ctx = canvas.getContext('2d');
    const gifts = makeGiftAtlas();
    const sphere=new Float32Array(field.length/STRIDE*3);
    let cachedShuffle=NaN;
    const atlas = document.createElement('canvas');
    const cell = 64;
    const cometAtlas = document.createElement('canvas');
    cometAtlas.width = cell*3; cometAtlas.height = cell;
    const ink=cometAtlas.getContext('2d');
    COMET_COLORS.forEach((color,i)=>{
        const x=(i+.5)*cell, y=cell/2, rgb=color.map(v=>Math.round(v*255)).join(',');
        const glow=ink.createRadialGradient(x,y,0,x,y,y);
        glow.addColorStop(0,'#fffae8'); glow.addColorStop(.16,'rgba('+rgb+',.95)');
        glow.addColorStop(.46,'rgba('+rgb+',.18)'); glow.addColorStop(1,'rgba('+rgb+',0)');
        ink.fillStyle=glow; ink.fillRect(i*cell,0,cell,cell);
    });
    const spriteColors=[...PALETTE,...GALAXY_COLORS];
    atlas.width = spriteColors.length*cell; atlas.height = 7*cell;
    const brush = atlas.getContext('2d');
    for (let kind = 0; kind < 7; kind++) {
        spriteColors.forEach((color, column) => {
            const rgb = color.map(value => Math.round(255*value)).join(',');
            brush.save();
            brush.translate((column+.5)*cell,(kind+.5)*cell);
            brush.fillStyle = 'rgb('+rgb+')';
            if (kind === 2 || kind === 3 || kind === 5 || kind === 6) {
                const sides = (kind === 3 || kind === 5) ? 5 : 4;
                brush.beginPath();
                for(let j=0;j<2*sides;j++) {
                    const a = Math.PI*j/sides-Math.PI/2-.18;
                    const r = j%2 === 0 ? 29 : sides===5 ? 12 : 5;
                    brush.lineTo(r*Math.cos(a),r*Math.sin(a));
                }
                brush.closePath(); brush.fill();
            } else {
                const g = brush.createRadialGradient(0,0,0,0,0,31);
                g.addColorStop(0,'rgb('+rgb+')');
                g.addColorStop(kind===1?.75:.28,'rgba('+rgb+','+(kind===1?.94:.65)+')');
                g.addColorStop(1,'rgba('+rgb+',0)');
                brush.fillStyle = g; brush.fillRect(-32,-32,64,64);
            }
            brush.restore();
        });
    }
    return {
        draw(w, h, ratio, l, weights, time, skyCos, skySin, shuffle=0, handYaw=0, handPitch=0) {
            ctx.setTransform(ratio,0,0,ratio,0,0);
            ctx.clearRect(0,0,w,h);
            const co=Math.cos(time*.115-handYaw), si=Math.sin(time*.115-handYaw);
            const treePitchSin=Math.sin(handPitch*.32), treePitchCos=Math.cos(handPitch*.32);
            const photoAngle=time*PHOTO_SPEED+.6*handYaw;
            const photoCos=Math.cos(photoAngle), photoSin=Math.sin(photoAngle);
            const yaw=time*GALAXY_SPEED+handYaw, pitch=-.14+handPitch;
            const yawCos=Math.cos(yaw), yawSin=Math.sin(yaw), pitchCos=Math.cos(pitch), pitchSin=Math.sin(pitch);
            const shuffleX=Math.sin(shuffle), shuffleY=Math.cos(shuffle);
            if(weights[2]>0 && shuffle!==cachedShuffle) {
                cachedShuffle=shuffle;
                for(let i=0,j=0;i<field.length;i+=STRIDE,j+=3) {
                    const seed=field[i+12],phase=seed*TAU;
                    const ox=field[i+6]+.13*Math.sin(phase)*shuffleX;
                    const oy=field[i+7]+.13*Math.cos(phase)*shuffleY;
                    const oz=field[i+8]+.14*(seed-.5)*shuffleX;
                    const norm=Math.hypot(field[i+6],field[i+7],field[i+8])/Math.max(.00001,Math.hypot(ox,oy,oz));
                    sphere[j]=(ox*shuffleY+oz*shuffleX)*norm;
                    sphere[j+1]=oy*norm;
                    sphere[j+2]=(oz*shuffleY-ox*shuffleX)*norm;
                }
            }
            const photoShare=Math.min(1,Math.max(0,weights[1]/Math.max(.00001,1-weights[2])));
            for (let i=0,j=0;i<field.length;i+=STRIDE,j+=3) {
                const kind=field[i+10], seed=field[i+12];
                let x, y, alpha, size=field[i+9]*l.dotScale;
                const colorColumn=field[i+11];
                let tintColumn=0, tintWeight=0, ornamentLight=1, ornamentSize=1;
                if (kind===8) {
                    if (weights[0]<=0) continue;
                    const strand=field[i], age=field[i+1];
                    const cycle=time/COMET_PERIOD+.21+strand/3-age*COMET_TAIL;
                    const h=cycle-Math.floor(cycle);
                    const angle=TAU*(h*COMET_TURNS+strand/3)+.115*time-handYaw;
                    const radius=.045+1.075*(1-h), sin=Math.sin(angle);
                    x=w/2+Math.cos(angle)*radius*l.treeWidth;
                    y=l.treeBase-.5*l.treeHeight+(.5-h)*l.treeHeight*treePitchCos
                        +sin*radius*(l.treeHeight*.065+l.treeWidth*treePitchSin);
                    const edge=Math.min(1,Math.min(h,1-h)/.025);
                    ctx.globalAlpha=weights[0]*(.34+.66*(.5+.5*sin))*(.46+.54*edge*edge*(3-2*edge))*(1-age)**2;
                    size=(4+8*(1-age)+13*Math.exp(-age*60))*l.dotScale;
                    ctx.drawImage(cometAtlas,strand*cell,0,cell,cell,x-size/2,y-size/2,size,size);
                    continue;
                } else if (kind===4 || kind===6) {
                    x=w/2+field[i]*skyCos-field[i+1]*skySin;
                    y=h/2+field[i]*skySin+field[i+1]*skyCos;
                    alpha=kind===4?.13:.67;
                } else {
                    const treeX=w/2+(field[i]*co-field[i+2]*si)*l.treeWidth;
                    const treeY=l.treeBase-.5*l.treeHeight+(.5-field[i+1])*l.treeHeight*treePitchCos
                        +(field[i]*si+field[i+2]*co)*(.024*l.treeHeight+l.treeWidth*treePitchSin);
                    const ornament=kind===5 || kind===7;
                    const t=Math.min(1,Math.max(0,(weights[2]-Math.floor(seed*4)*.065)/.805));
                    const spread=t*t*(3-2*t);
                    x=treeX; y=treeY;
                    if(!ornament && photoShare>0) {
                        const px=field[i+3]*photoCos-field[i+4]*photoSin;
                        const py=(field[i+3]*photoSin+field[i+4]*photoCos)*treePitchCos+.25*Math.sin(seed*TAU)*treePitchSin;
                        x+=(w/2+px*l.photoWidth-treeX)*photoShare;
                        y+=(l.centerY+py*l.photoHeight-treeY)*photoShare;
                    }
                    alpha=.56+.35*Math.sin(time*1.5+seed*32);
                    if(spread>0) {
                        const ox=sphere[j], oy=sphere[j+1], oz=sphere[j+2];
                        const gx=ox*yawCos+oz*yawSin, gz=oz*yawCos-ox*yawSin;
                        const gy=oy*pitchCos+gz*pitchSin, distance=gz*pitchCos-oy*pitchSin;
                        const scale=l.sphereRadius/(1-.18*distance);
                        const offsetX=gx*scale, offsetY=gy*scale;
                        const dx=w/2+offsetX-x, dy=l.centerY+offsetY-y;
                        const bend=4*spread*(1-spread)*(.12+.15*seed);
                        x+=dx*spread-dy*(w/h)*bend; y+=dy*spread+dx*(h/w)*bend;
                        const proximity=Math.min(1.5,Math.max(.38,.94+.48*distance));
                        const light=Math.min(1.32,Math.max(.14,.56+.6*distance-.16*gx-.18*gy))
                            +.28*Math.max(0,1-Math.abs(distance))**4;
                        ornamentLight=1+(.67+.32*distance-1)*spread;
                        ornamentSize=1+(.90+.21*distance-1)*spread;
                        alpha=Math.min(1,alpha*(1+(light-1)*spread));
                        size*=1+(proximity-1)*spread;
                        if(kind===0) {
                            const radius2=field[i+6]**2+field[i+7]**2;
                            const tint=radius2<.075 || seed<.23 ? 0 : seed<.71 ? 1 : seed<.89 ? 2 : 3;
                            tintColumn=PALETTE.length+tint; tintWeight=.65*spread;
                        }
                    }
                    if(ornament) alpha=(spread+(1-spread)*(1-photoShare))*ornamentLight;
                    if(kind===5) size=field[i+9]*l.dotScale*(1-.47*spread)*ornamentSize;
                    if(kind===7) {
                        if(alpha<.01) continue;
                        const z=field[i]*si+field[i+2]*co;
                        size=Math.max(23,field[i+9]*l.dotScale)*(1+.12*z)*(1-.38*spread)*ornamentSize;
                        ctx.globalAlpha=alpha*(.88+.12*z);
                        ctx.drawImage(gifts,colorColumn*GIFT_CELL,0,GIFT_CELL,GIFT_CELL,x-size/2,y-size/2,size,size);
                        continue;
                    }
                }
                if(alpha<.01) continue;
                ctx.globalAlpha=alpha*(1-tintWeight);
                ctx.drawImage(atlas,colorColumn*cell,kind*cell,cell,cell,x-size/2,y-size/2,size,size);
                if(tintWeight>0) {
                    ctx.globalAlpha=alpha*tintWeight;
                    ctx.drawImage(atlas,tintColumn*cell,kind*cell,cell,cell,x-size/2,y-size/2,size,size);
                }
            }
        },
        dispose() { atlas.width=0; gifts.width=0; cometAtlas.width=0; }
    };
}

function mountScene(canvas) {
    canvas.style.background=TREE_SKY;
    const field = makeField(2400);
    const gl = canvas.getContext('webgl', {alpha:true, antialias:false, depth:false,
        stencil:false, powerPreference:'low-power', preserveDrawingBuffer:false});
    let painter, fallbackCanvas;
    function createPainter() {
        if (gl) {
            try { return gpuRenderer(gl, field); }
            catch (error) { console.warn('Using the canvas particle renderer.', error); }
        }
        // A canvas with an existing WebGL context cannot subsequently acquire a 2D context.
        let layer = canvas;
        if (gl) {
            fallbackCanvas = document.createElement('canvas');
            fallbackCanvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
            canvas.insertAdjacentElement('afterend', fallbackCanvas);
            layer = fallbackCanvas;
        }
        return canvasRenderer(layer, makeField(1250));
    }
    painter = createPainter();
    const motion = matchMedia('(prefers-reduced-motion: reduce)');
    const weights = new Float32Array([1,0,0]);
    const startWeights = new Float32Array(weights);
    let target=0, start=0, elapsed=0, previous=0, request=0, lost=false, stopped=false;
    let duration=440, scattering=false, shuffle=0;
    let handYaw=0, handPitch=0, yawSpeed=0, pitchSpeed=0, coastAfter=0;
    const rotation={yaw:0,pitch:-.14};
    const limitPitch=value=>Math.max(-1.20,Math.min(1.20,value));
    let width, height, size, ratio;
    function resize() {
        width=Math.max(1,canvas.clientWidth);
        height=Math.max(1,canvas.clientHeight);
        ratio=Math.min(window.devicePixelRatio || 1,1.7);
        size=layout(width,height);
        for (const item of [canvas,fallbackCanvas]) {
            if (!item) continue;
            item.width=Math.round(width*ratio); item.height=Math.round(height*ratio);
        }
        wake();
    }
    function updateWeights(now) {
        const progress=motion.matches ? 1 : Math.min(1,Math.max(0,(now-start)/duration));
        // Starts moving on the first frame and still lands softly into its final pose.
        const ease=scattering ? progress : 1-(1-progress)**3;
        for(let i=0;i<3;i++) weights[i]=startWeights[i]+((i===target?1:0)-startWeights[i])*ease;
        return progress;
    }
    function draw(now) {
        request=0;
        if (document.hidden || lost || stopped) return;
        const dt=previous ? Math.max(0,Math.min(.08,(now-previous)/1000)) : 0;
        if(!motion.matches) {
            elapsed+=dt;
            if(now>coastAfter && (yawSpeed || pitchSpeed)) {
                // Add momentum only after camera samples stop; delta has already
                // moved the scene during tracking. Integrate exponential drag.
                const coastDt=Math.min(dt,(now-coastAfter)/1000);
                const decay=Math.exp(-coastDt/.15), travel=.15*(1-decay);
                handYaw+=yawSpeed*travel;
                handPitch=limitPitch(handPitch+pitchSpeed*travel);
                yawSpeed*=decay; pitchSpeed*=decay;
                if(Math.abs(yawSpeed)<.004) yawSpeed=0;
                if(Math.abs(pitchSpeed)<.004) pitchSpeed=0;
            }
        } else { yawSpeed=0; pitchSpeed=0; }
        previous=now;
        updateWeights(now);
        const angle = elapsed * SKY_SPEED + handYaw*.14;
        const skyRadius = Math.hypot(width,height) * .51;
        painter.draw(width,height,ratio,size,weights,elapsed,Math.cos(angle)*skyRadius,Math.sin(angle)*skyRadius,
            shuffle,handYaw,handPitch);
        if (!motion.matches) wake();
    }
    function wake() {
        if (!request && !document.hidden && !lost && !stopped) request=requestAnimationFrame(draw);
    }
    function visibility() {
        previous=0; yawSpeed=0; pitchSpeed=0;
        if(document.hidden) { cancelAnimationFrame(request); request=0; } else wake();
    }
    function contextLost(event) {
        event.preventDefault(); lost=true; cancelAnimationFrame(request); request=0;
    }
    function contextRestored() {
        fallbackCanvas?.remove(); fallbackCanvas=null;
        painter=createPainter(); lost=false; resize();
    }
    const observer=new ResizeObserver(resize);
    observer.observe(canvas); resize();
    motion.addEventListener('change',wake);
    document.addEventListener('visibilitychange',visibility);
    canvas.addEventListener('webglcontextlost',contextLost);
    canvas.addEventListener('webglcontextrestored',contextRestored);
    return {
        nudge(dx,dy,dt) {
            if(stopped || document.hidden || !Number.isFinite(dx) || !Number.isFinite(dy) ||
               !Number.isFinite(dt) || dt<=0 || dt>.25) return;
            // The tracker already applies a spatial dead zone. Preserve every
            // remaining small delta so slow, steady hand movement accumulates.
            const length=Math.hypot(dx,dy);
