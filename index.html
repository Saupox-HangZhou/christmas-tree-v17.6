<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180d11">
<meta name="description" content="用手势把星光聚成圣诞树，让珍藏的照片围成一颗心。">
<title>圣诞 · 星光许愿树</title>
<style>
:root{color-scheme:dark;--gold:#ffdfa7;--soft:#d9bc93;--edge:#b8935b65;--glass:#160d10da;--pad:clamp(18px,3.8vw,70px);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#fff1d5;background:#130b10}
*{box-sizing:border-box}
body{margin:0;overflow:hidden}
#stage{position:fixed;inset:0;isolation:isolate;background:radial-gradient(ellipse at 50% 62%,#59311e,#231316 55%,#0d080e 100%)}
#stars,#wall,#spotlight{position:absolute;inset:0;width:100%;height:100%}
#stars{display:block;touch-action:manipulation}
button,a,input{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #ffd58a;outline-offset:4px}
button:active{transform:translateY(1px)}
button,.panel a{touch-action:manipulation}
.mast{position:absolute;inset:clamp(18px,5vh,58px) var(--pad) auto;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:3}
.brand{max-width:35vw;text-shadow:0 2px 18px #2d120d}
h1{font-size:clamp(21px,2.65vw,54px);line-height:1.14;color:#ffe5b5;margin:0;font-weight:750;letter-spacing:-.035em;overflow-wrap:anywhere}
.english{display:block;margin:5px 0 0;font:600 clamp(8px,.78vw,14px)/1.2 Georgia,serif;letter-spacing:.33em;color:#e6bd85}
.pill,.tools,.preview,.photo-count,.drawer-button{background:var(--glass);border:1px solid var(--edge);box-shadow:inset 0 1px #ffffff0b;color:var(--gold)}
.mode-label{position:absolute;left:50%;transform:translateX(-50%);padding:7px 19px;border-radius:24px;font-size:clamp(12px,1.15vw,22px);white-space:nowrap}
.camera-toggle{pointer-events:auto;display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:7px 16px;border-radius:24px;font-size:clamp(12px,1vw,17px)}
.dot{width:7px;height:7px;border-radius:50%;background:#be966a}
[data-live="true"] .dot{background:#82ea99;box-shadow:0 0 9px #74e69680}
#spotlight{display:grid;place-content:center;justify-items:center;pointer-events:none;padding:14vh 20px 11vh;z-index:1}
.focus-frame{position:relative;display:grid;border:1px solid #fed38c;padding:5px;background:#4a3020;border-radius:12px;box-shadow:0 0 0 2px #7b5837,0 0 28px #ffc2643d,0 20px 60px #05010377;overflow:hidden;pointer-events:auto}
.focus-frame img{display:block;width:auto;height:auto;max-width:min(61vw,850px);max-height:65vh;min-width:60px;min-height:60px;object-fit:contain;border-radius:7px}
.photo-count{margin-top:13px;padding:5px 14px;border-radius:30px;font-size:12px}
#wall{z-index:1;pointer-events:none}
.heart-card{position:absolute;display:block;width:clamp(42px,min(7.2vw,11vh),142px);aspect-ratio:.83;overflow:hidden;padding:2px;background:linear-gradient(150deg,#ffdda6,#997345 52%,#f8ce90);border:0;border-radius:8%;box-shadow:0 0 12px #fec77b3d,0 6px 22px #16091099;pointer-events:auto;transition:filter .15s}
.heart-card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6%}
.heart-card:hover{filter:brightness(1.16);z-index:1}
[hidden]{display:none!important}
.preview{position:absolute;right:clamp(12px,2vw,36px);bottom:clamp(61px,8vh,100px);width:clamp(126px,16.5vw,290px);padding:8px;border-radius:13px;z-index:2}
.preview-title{display:block;margin:0 0 5px 1px;font:600 10px/1 Georgia,serif;letter-spacing:.11em;color:#d6b990}
.feed{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid #88724e66;background:#20171a;border-radius:4px;display:grid;place-items:center}
.feed video,.feed canvas{position:absolute;width:100%;height:100%;inset:0;object-fit:fill;transform:scaleX(-1)}
.feed video{object-fit:contain}
.feed canvas{object-fit:contain;pointer-events:none}
.feed button{z-index:1;padding:8px 12px;border:1px solid var(--edge);border-radius:30px;background:#201718;font-size:12px}
.bottom{position:absolute;inset:auto var(--pad) max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;gap:10px;z-index:3}
.tools{display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:40px;max-width:100%}
.tools button,.drawer-button{white-space:nowrap;border-radius:30px;padding:7px 12px;font-size:12px;line-height:1.3}
.tools button{background:none;border:0;color:#e4cbb1}
.tools button[aria-pressed="true"]{background:#704a2d60;color:#fff1cf}
.tools button:hover,.drawer-button:hover,.camera-toggle:hover,.feed button:hover{background:#523322}
.drawer-button{position:absolute;left:0}
.tools .shortcut{font:11px Georgia,serif;opacity:.78;margin-left:4px}
.panel{position:fixed;inset:0;margin:auto;padding:24px;width:min(390px,calc(100vw - 32px));max-height:88dvh;border:1px solid #89683f;border-radius:18px;background:#21161a;color:#f8e7cc;box-shadow:0 28px 85px #0009}
.panel::backdrop{background:#0b050abc}
.panel-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.panel h2{font:600 22px/1.2 "Microsoft YaHei",sans-serif;margin:0}
.panel button,.panel label.file,.panel a{background:#322329;border:1px solid #886a4b;border-radius:8px;color:#ffe3bd;padding:9px 12px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.panel label.field,.panel legend{display:block;margin:0 0 8px;font-size:13px;color:#e8c594}
.panel input[type=text]{width:100%;border:1px solid #886a4b;color:#fff2de;background:#140e12;border-radius:7px;padding:9px}
.panel fieldset{border:0;margin:17px 0 0;padding:0}
.panel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel footer{display:flex;justify-content:space-between;gap:10px;margin-top:22px;align-items:center}
.panel footer a{border:0;background:transparent;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.detail{margin:7px 0 0;font-size:12px;line-height:1.6;color:#c6b19a}
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);max-width:min(85vw,580px);padding:8px 15px;border:1px solid var(--edge);border-radius:15px;color:#fff0d7;background:#24161bed;text-align:center;font-size:13px;z-index:6}
@media(max-width:820px){.drawer-button{position:static}.tools .shortcut{display:none}.mast{inset:22px 20px auto}.mode-label{top:50px;font-size:12px}.preview{width:116px;right:12px;bottom:65px}.focus-frame img{max-width:77vw;max-height:56vh}}
@media(max-width:520px){.brand{max-width:59vw}.camera-toggle{padding:7px 11px;min-height:35px;font-size:11px}.english{letter-spacing:.22em}.mode-label{top:53px;padding:5px 12px}.bottom{inset-inline:6px;gap:4px}.tools{gap:0;padding:3px}.tools button,.drawer-button{font-size:11px;padding:10px 8px}.preview{width:94px;padding:5px;bottom:66px}.preview-title{font-size:7px}.feed button{font-size:10px;padding:4px 6px}.photo-count{font-size:11px}.heart-card{width:clamp(35px,8.7vw,45px)}}
@media(max-height:500px) and (min-width:521px){.mast{inset:10px 15px auto}.mode-label{top:0}.preview{width:102px}.bottom{bottom:5px}.tools button,.drawer-button{padding:5px 9px}.focus-frame img{max-height:60vh}}
@media(prefers-reduced-motion:no-preference){#stage[data-mode="photo"] .focus-frame{animation:reveal .24s ease-out both}#stage[data-mode="heart"] .heart-card{animation:appear .22s ease-out both}@keyframes reveal{from{opacity:.2;transform:scale(.95)}}@keyframes appear{from{opacity:.15}}}
</style>
</head>
<body>
<main id="stage" data-mode="tree">
  <canvas id="stars" aria-label="金色粒子圣诞树，树顶有一颗五角星"></canvas>
  <header class="mast">
    <div class="brand"><h1 id="title">圣诞 · 星光许愿树</h1><span class="english" lang="en">CHRISTMAS WISH TREE</span></div>
    <div id="mode-label" class="mode-label pill" role="status">握拳 · 星光聚成树</div>
    <button id="camera-toggle" class="camera-toggle pill" aria-pressed="false"><span class="dot"></span><span id="camera-state">开启手势</span></button>
  </header>
  <div id="spotlight" hidden><button class="focus-frame" title="换一张照片" aria-label="换一张照片"><img id="focus-photo" alt="正在展示的照片"></button><div id="photo-count" class="photo-count"></div></div>
  <div id="wall" aria-label="爱心照片墙" hidden></div>
  <aside class="preview" aria-label="手势摄像头预览"><span class="preview-title" lang="en">GESTURE CAM</span><div class="feed"><video id="video" muted playsinline autoplay></video><canvas id="skeleton" hidden></canvas><button id="camera-start">开启镜头</button></div></aside>
  <nav class="bottom" aria-label="场景操作">
    <button id="settings" class="drawer-button">我的设置</button>
    <div class="tools"><button data-mode="tree" aria-pressed="true">握拳 · 聚成树</button><button data-mode="photo" aria-pressed="false">1–4 指 · 照片</button><button data-mode="heart" aria-pressed="false">五指 · 爱心</button><button id="full">全屏<span class="shortcut">F</span></button></div>
  </nav>
  <div class="toast" role="status" hidden></div>
</main>
<dialog class="panel" id="panel" aria-labelledby="settings-title">
  <div class="panel-top"><h2 id="settings-title">我的许愿树</h2><button id="close">关闭</button></div>
  <label class="field" for="title-input">树的名字</label><input id="title-input" type="text" maxlength="32" value="圣诞 · 星光许愿树">
  <fieldset><legend>照片</legend><div class="row"><button id="pick-photos">添加照片</button><button id="manage-photos">管理照片</button><input type="file" id="photos-input" accept="image/*" multiple hidden></div><p id="album-info" class="detail"></p><div id="album-list" class="row" hidden></div></fieldset>
  <fieldset><legend>背景音乐</legend><div class="row"><button id="pick-music">选择音乐</button><input type="file" id="music-input" accept="audio/*" hidden><button id="music-play" disabled>播放</button></div></fieldset>
  <p class="detail">键盘 0 聚成树，1–4 看照片，5 展开爱心。空格换照片，Esc 收回照片。</p>
  <footer><a href="./classic.html">经典版</a><a href="./assets/photos/CREDITS.md">示例照片来源</a><button id="done">完成</button></footer>
</dialog>
<script type="module">
const {mountScene,heartPoint} = (() => {
// All particle poses share one vertex buffer, so a gesture only changes three
// interpolation weights. The hand tracker and the scene have independent clocks.
const TAU = Math.PI * 2;
const MODES = {tree: 0, photo: 1, heart: 2};
const STRIDE = 13;
const PALETTE = [
    [1, .87, .60], [.98, .72, .34], [1, .95, .82], [.88, .49, .20],
    [1, .43, .32], [.40, .85, .59], [.97, .79, .49]
];
const PHOTO_HEART = [
    [-.53, -.75], [.53, -.75], [-1, -.42], [-.42, -.42], [.42, -.42],
    [1, -.42], [-.88, -.03], [0, -.03], [.88, -.03], [-.66, .33],
    [.66, .33], [0, .68]
];

function layout(width, height) {
    // Scale the drawing with the available stage, including when a phone turns sideways.
    const treeHeight = Math.min(height * .63, width * 1.02);
    return {
        treeWidth: treeHeight * .423, treeHeight, treeBase: height * .55 + treeHeight * .54,
        heartWidth: Math.min(width * .408, height * .715),
        heartHeight: Math.min(height * .438, width * .48),
        centerY: height * .509,
        photoWidth: Math.min(width * .43, height * .65), photoHeight: height * .45,
        dotScale: Math.max(.72, Math.min(1.7, Math.min(height / 585, width / 620)))
    };
}

function heartPoint(index, count, width, height) {
    const l = layout(width, height);
    let point;
    if (count === 12) point = PHOTO_HEART[index % 12];
    else if (count === 1) point = [0, 0];
    else {
        const a = (index + .5) * TAU / Math.max(1, count);
        point = [Math.sin(a) ** 3,
            -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) / 17];
    }
    return {x: width / 2 + point[0] * l.heartWidth * .63,
        y: l.centerY + point[1] * l.heartHeight * .89};
}

function makeField(count) {
    let state = 0x12c27;
    const random = () => {
        state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
        return state / 4294967296;
    };
    const jitter = () => random() + random() + random() - 1.5;
    const data = [];
    for (let i = 0; i < count; i++) {
        const t = random() ** .64; // circumference grows towards the lower branches
        // Approximately half the lights trace loose, overlapping spiral garlands.
        const theta = random() < .48 ? t * TAU * 4.4 + jitter() * .65 + (i % 3) * TAU / 3 : random() * TAU;
        const radius = (.70 + random() * .31) * t;
        const tree = [radius * Math.cos(theta), 1 - t, radius * Math.sin(theta)];
        const angle = random() * TAU;
        const ring = random() < .8 ? .76 + jitter() * .28 : Math.sqrt(random()) * 1.12;
        const photo = [Math.cos(angle) * ring, Math.sin(angle) * ring, random()];
        const a = random() * TAU;
        const hx = Math.sin(a) ** 3;
        const hy = -(13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)) / 17;
        const band = random() < .79 ? 1 + jitter() * .10 : .24 + random() * .86;
        const heart = [hx * band + jitter() * .046, hy * band + jitter() * .075, random()];
        const n = random(), k = random();
        const kind = n < .077 ? 1 : n < .148 ? 2 : n < .193 ? 3 : 0;
        const diameter = kind === 1 ? 3.7 + 8.5 * random() ** 2 :
            kind >= 2 ? 4.2 + 10.2 * random() ** 2 : 1.6 + 4.3 * random() ** 2;
        const color = kind === 1 ? (k < .17 ? 4 : k < .29 ? 5 : k < .64 ? 1 : 0) :
            kind >= 2 ? (k < .67 ? 2 : 0) :
            k < .26 ? 0 : k < .59 ? 1 : k < .72 ? 2 : k < .85 ? 3 :
            k < .88 ? 4 : k < .90 ? 5 : 6;
        data.push(...tree, ...photo, ...heart, diameter, kind, color, random());
    }
    // Stable sky specks and out-of-focus lamps shared by all three modes.
    for (let i = 0; i < 138; i++) {
        const bokeh = i < 35, x = random() * 2 - 1, y = random() * 2 - 1;
        data.push(x, y, 0, 0, 0, 0, 0, 0, 0,
            bokeh ? 12 + random() ** 2 * 55 : 1.1 + random() ** 3 * 5,
            bokeh ? 4 : 6, bokeh ? 3 : 2, random());
    }
    data.push(0, 1.052, 0, 0, 0, 0, 0, 0, 0, 43, 5, 2, .1);
    return new Float32Array(data);
}

const VERTEX = `
attribute vec3 aTree;
attribute vec3 aPhoto;
attribute vec3 aHeart;
attribute vec4 aSprite;
uniform vec2 uViewport;
uniform vec3 uTree;
uniform vec4 uOther;
uniform vec3 uWeight;
uniform vec4 uFrame;
uniform float uCenterY;
varying lowp vec3 vColor;
varying mediump float vKind;
varying mediump float vAlpha;
varying mediump float vPhase;
vec3 palette(float i) {
    if(i < .5) return vec3(1.,.87,.60);
    if(i < 1.5) return vec3(.98,.72,.34);
    if(i < 2.5) return vec3(1.,.95,.82);
    if(i < 3.5) return vec3(.88,.49,.20);
    if(i < 4.5) return vec3(1.,.43,.32);
    if(i < 5.5) return vec3(.40,.85,.59);
    return vec3(.97,.79,.49);
}
void main() {
    float time = uFrame.x, phase = aSprite.w * 6.283185;
    float spin = time * .115;
    float z = aTree.x * sin(spin) + aTree.z * cos(spin);
    float x = aTree.x * cos(spin) - aTree.z * sin(spin);
    vec2 tree = vec2(uViewport.x*.5+x*uTree.x, uTree.z-aTree.y*uTree.y+z*uTree.y*.024);
    vec2 breathe = vec2(cos(time*.33+phase),sin(time*.43+phase));
    vec2 photo = vec2(uViewport.x*.5,uCenterY) + aPhoto.xy * uOther.xy + breathe * (1.+4.*aPhoto.z);
    vec2 heart = vec2(uViewport.x*.5,uCenterY-.055*uViewport.y) + aHeart.xy * uOther.zw + breathe * (1.+2.*aHeart.z);
    vec2 p = tree*uWeight.x + photo*uWeight.y + heart*uWeight.z;
    vKind = aSprite.y;
    vColor = palette(aSprite.z);
    vPhase = phase;
    float brightness = 1.0 + .19*sin(time*(1.+aSprite.w*1.4)+phase*7.);
    float depth = 1. + z*.22*uWeight.x;
    vAlpha = (.73 + .42*aSprite.w) * brightness * depth;
    float size = aSprite.x * uFrame.z * depth * (1.+.14*uWeight.z);
    vAlpha *= 1.+.16*uWeight.z;
    if(vKind == 4. || vKind == 6.) {
        p = (aTree.xy*.5+.5)*uViewport + breathe * (vKind==4. ? 5. : 2.);
        vAlpha = vKind==4. ? .12+.12*aSprite.w : .36+.40*brightness;
    }
    if(vKind == 5.) {
        p = tree;
        vAlpha = uWeight.x;
        size *= .25+.75*uWeight.x;
    }
    gl_Position = vec4(p/uViewport*vec2(2.,-2.)+vec2(-1.,1.),0.,1.);
    gl_PointSize = clamp(size*uFrame.y, 1., uFrame.w);
}`;

const FRAGMENT = `
precision mediump float;
varying lowp vec3 vColor;
varying mediump float vKind;
varying mediump float vAlpha;
varying mediump float vPhase;
float star(vec2 p, float rotation){
    float a = abs(mod(atan(p.x,-p.y)+rotation+.62832,1.25664)-.62832);
    float edge = .2351 / (.4*sin(.62832-a) + sin(a));
    return 1.-smoothstep(edge-.045,edge+.025,length(p));
}
void main() {
    vec2 p = gl_PointCoord*2.-1.;
    float r = length(p);
    float light;
    vec3 color = vColor;
    if (vKind < .5) {
        light = (1.-smoothstep(.10,.91,r))*.86;
    } else if(vKind < 1.5) {
        // A small faceted ornament with an edge light and a hot glint.
        float facet = .88+.10*cos(6.*atan(p.y,p.x)+vPhase);
        light = (1.-smoothstep(facet-.10,facet,r))*.94;
        float highlight = exp(-16.*dot(p+vec2(.30,.33),p+vec2(.30,.33)));
        color = mix(color*.96,vec3(1.,.97,.84),highlight*.85);
    } else if (vKind < 2.5 || vKind > 5.5) {
        float spike = pow(max(0.,1.-abs(p.x*p.y)*18.-r*.88),3.);
        light = spike + .42*exp(-r*r*11.);
    } else if(vKind < 3.5 || vKind == 5.) {
        float rotation = vKind == 5. ? -.21 : vPhase;
        light = star(p*1.24,rotation) + .40*exp(-r*r*4.)*(1.-smoothstep(.72,1.,r));
    } else {
        light = exp(-r*r*5.)*(1.-smoothstep(.7,1.,r));
    }
    gl_FragColor = vec4(color, clamp(light*vAlpha,0.,1.));
}`;

function compile(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader);
        gl.deleteShader(shader);
        throw new Error(message);
    }
    return shader;
}

function gpuRenderer(gl, field) {
    const program = gl.createProgram();
    const shaders = [compile(gl, gl.VERTEX_SHADER, VERTEX), compile(gl, gl.FRAGMENT_SHADER, FRAGMENT)];
    for (const shader of shaders) gl.attachShader(program, shader);
    gl.linkProgram(program);
    for (const shader of shaders) gl.deleteShader(shader);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, field, gl.STATIC_DRAW);
    for (const [name, size, offset] of [['aTree',3,0],['aPhoto',3,3],['aHeart',3,6],['aSprite',4,9]]) {
        const location = gl.getAttribLocation(program, name);
        gl.enableVertexAttribArray(location);
        gl.vertexAttribPointer(location, size, gl.FLOAT, false, STRIDE*4, offset*4);
    }
    const uniform = Object.fromEntries(['Viewport','Tree','Other','Weight','Frame','CenterY']
        .map(key => [key, gl.getUniformLocation(program, 'u'+key)]));
    const maxSize = gl.getParameter(gl.ALIASED_POINT_SIZE_RANGE)[1];
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(0,0,0,0);
    return {
        draw(w, h, ratio, l, weights, time) {
            gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
            gl.clear(gl.COLOR_BUFFER_BIT);
            gl.uniform2f(uniform.Viewport, w, h);
            gl.uniform3f(uniform.Tree, l.treeWidth, l.treeHeight, l.treeBase);
            gl.uniform4f(uniform.Other, l.photoWidth, l.photoHeight, l.heartWidth, l.heartHeight);
            gl.uniform1f(uniform.CenterY, l.centerY);
            gl.uniform3fv(uniform.Weight, weights);
            gl.uniform4f(uniform.Frame, time, ratio, l.dotScale, maxSize);
            gl.drawArrays(gl.POINTS, 0, field.length/STRIDE);
        },
        dispose() { gl.deleteBuffer(buffer); gl.deleteProgram(program); }
    };
}

function canvasRenderer(canvas, field) {
    const ctx = canvas.getContext('2d');
    const atlas = document.createElement('canvas');
    const cell = 64;
    atlas.width = PALETTE.length*cell; atlas.height = 7*cell;
    const brush = atlas.getContext('2d');
    for (let kind = 0; kind < 7; kind++) {
        PALETTE.forEach((color, column) => {
            const rgb = color.map(value => Math.round(255*value)).join(',');
            brush.save();
            brush.translate((column+.5)*cell,(kind+.5)*cell);
